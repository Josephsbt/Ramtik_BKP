<!-- Main Header -->
<div style="position: absolute;
    top: 60px;
    right: 20px;
    width: 50px;
    height: 50px;" class="{{gloading}}">

  </div>
<header class="main-header">

  <!-- Isotipo Entel + BKP CESOP -->
  <a href="#" class="logo">
    <span class="logo-mini">
      <img ng-src="../src/assets/entel-logo-official.png" class="cyber-logo-entel-header" alt="Entel"/>
    </span>
    <span class="logo-lg">
      <img ng-src="../src/assets/entel-logo-official.png" class="cyber-logo-entel-header" alt="Entel"/>
      <span class="cyber-wordmark">BKP <b>CESOP</b></span>
    </span>
  </a>

  <!-- Header Navbar -->
  <nav class="navbar navbar-static-top" role="navigation">
    <!-- Reloj central + reloj de arena + countdown -->
    <div class="navbar-clock-center">
      <span class="clock-time">{{time | date:'HH:mm:ss'}}</span>
      <i class="fa fa-hourglass-half hourglass-icon" ng-style="{'transform': 'rotate(' + hourglassDeg + 'deg)'}" title="Reloj de arena"></i>
      <span class="clock-countdown" title="Tiempo restante de la jornada">{{countdown}}</span>
    </div>

    <!-- Navbar Right Menu -->
    <div class="navbar-custom-menu">
      <ul class="nav navbar-nav">
          <li class="dropdown notifications-menu" style="padding-top: 5px;padding-right:10px">
          </li>
          <li class="dropdown state-dropdown"> 
            <a href="" class="dropdown-toggle" data-toggle="dropdown" aria-expanded="false">
            <div class="alert {{estadoLogConexion=='FUERA DE LINEA' ? 'alert-danger':estadoLogConexion=='BREAK' ? 'alert-info':estadoLogConexion=='EN COLACION' ? 'alert-danger':estadoLogConexion=='EN LINEA' ? 'alert-success':estadoLogConexion=='INICIO JORNADA' ? 'alert-warning':estadoLogConexion=='TERMINO JORNADA' ? 'alert-hola':'alert-danger' }}" style="width: 190px; height: 25px; padding: 3px; margin: 0; ">
              &nbsp;&nbsp;<i class="fa {{estadoLogConexion=='FUERA DE LINEA' ? 'fa-times-circle':estadoLogConexion=='BREAK' ? 'fa-coffee':estadoLogConexion=='EN COLACION' ? 'fa-utensils':estadoLogConexion=='EN LINEA' ? 'fa-user':estadoLogConexion=='INICIO JORNADA' ? 'fa-play-circle':estadoLogConexion=='TERMINO JORNADA' ? 'fa-stop-circle':'fa-times-circle' }}"></i>&nbsp;&nbsp;{{estadoLogConexion}}
              <span class="caret"></span>
            </div>
             </a>
            <ul class="dropdown-menu state-menu" role="menu">
              <li><a href="#" ng-click="grabalogConexion('BREAK')" ng-class="{'state-active': estadoLogConexion === 'BREAK'}"><i class="fa fa-coffee"></i><span>BREAK</span></a></li>
              <li><a href="#" ng-click="grabalogConexion('EN COLACION')" ng-class="{'state-active': estadoLogConexion === 'EN COLACION'}"><i class="fa fa-cutlery"></i><span>EN COLACIÓN</span></a></li>
              <li><a href="#" ng-click="grabalogConexion('EN LINEA')" ng-class="{'state-active': estadoLogConexion === 'EN LINEA'}"><i class="fa fa-headphones"></i><span>EN LÍNEA</span></a></li>
              <li><a href="#" ng-click="grabalogConexion('INICIO JORNADA')" ng-class="{'state-active': estadoLogConexion === 'INICIO JORNADA'}"><i class="fa fa-bolt"></i><span>INICIO JORNADA</span></a></li>
              <li><a href="#" ng-click="grabalogConexion('TERMINO JORNADA')" ng-class="{'state-active': estadoLogConexion === 'TERMINO JORNADA'}"><i class="fa fa-flag-checkered"></i><span>TÉRMINO JORNADA</span></a></li>
            </ul>
          </li>

          <li class="dropdown messages-menu">
            <a href="{{imagePathDoc}}ManualBKP.docx" target="_blank" data-toggle="tooltip" title="Manual">
              <i class="fa fa-folder folder-glow-icon"></i>
            </a>
          </li>

          <!-- User Account Menu -->
          <li class="dropdown user user-menu">
            <a href="" class="dropdown-toggle" data-toggle="dropdown">
              <img ng-src="{{selectedAvatar}}" class="user-image" alt="User Image">
              <span class="hidden-xs">{{currentUser.user_name}}</span>
            </a>
            <ul class="dropdown-menu user-panel" >
              <li class="user-header" style="height:auto;background:transparent;">
                <img ng-src="{{selectedAvatar}}" class="img-circle" alt="User Image">
                <p>{{currentUser.user_name}}</p>
                <div class="avatar-selector">
                  <img ng-repeat="av in avatars" ng-src="{{av}}" class="avatar-option" ng-class="{'active': selectedAvatar === av}" ng-click="selectAvatar(av)" alt="Avatar">
                </div>
              </li>
              <li class="user-body">
                <div class="col-xs-6 text-center">
                  <a href="#" class="user-action-link">Cambio de contraseña</a>
                </div>
                <div class="col-xs-6 text-center">
                  <a href="#" class="user-action-link">Modificar datos</a>
                </div>
              </li>
              <li class="user-footer" style="background: transparent;">
                <div class="pull-right">
                  <a href="#" ng-click="goOut()" class="game-over-btn">GAME OVER</a>
                </div>
              </li>
            </ul>
          </li>
      </ul>
    </div>
  </nav>
</header>
