<!-- Tira activadora (siempre visible) -->
<div class="sidebar-trigger"></div>

<aside class="main-sidebar">

  <!-- Logo sidebar (visible al expandir) -->
  <div class="sidebar-brand">
    <img ng-src="../src/assets/logo-ramtik.svg" alt="Ramtik Latam" class="sidebar-brand__logo"/>
    <span class="sidebar-brand__text">BKP <b>CESOP</b></span>
  </div>

  <!-- sidebar: style can be found in sidebar.less -->
  <section class="sidebar">

    <!-- Sidebar Menu -->
    <form class="sidebar-form">

    <ul class="sidebar-menu">
       <li class="header cyber-side-header">
         <svg viewBox="0 0 20 20" width="14" height="14" style="vertical-align:-2px;margin-right:6px" aria-hidden="true">
           <rect x="3" y="4" width="14" height="11" rx="2" fill="none" stroke="#0088ff" stroke-width="1.6"/>
           <rect x="7" y="7" width="2" height="2" fill="#0088ff"/>
           <rect x="11" y="7" width="2" height="2" fill="#0088ff"/>
           <rect x="8" y="11" width="4" height="1.4" fill="#ff5a00"/>
         </svg>
         Menu Principal
       </li>
       <li ng-click="cambiaMenu('1')"> 
         <a href="" ui-sref="home.dashboard"> <i class="fa fa-pie-chart {{Menu == '1' ? 'text-green':'text-white'}}"></i><span>{{currentUser.profile==0 ||currentUser.profile==1 ? 'Dashboard':'Inicio'}}</span></a>  
       </li>
       <li ng-click="cambiaMenu('6')" ng-show="currentUser.profile==0 ||currentUser.profile==1"> 
         <a href="" ui-sref="warning"> <i class="fa fa-warning {{Menu == '6' ? 'text-green':'text-white'}}"></i><span>Warning</span></a>  
       </li>
       <li ng-click="cambiaMenu('7')">    
         <a href="" ui-sref="busquedatickets"> <i class="fa fa-search {{Menu == '7' ? 'text-green':'text-white'}}"></i><span>Búsqueda Tickets</span></a>         
       </li>
       <li>
         <a href="" ng-click="goOut()" class="sidebar-gameover"><i class="fa fa-power-off"></i><span>GAME OVER</span><small class="sidebar-gameover__sub">Insert Coin to Exit</small></a>
       </li>
    </ul>

    </form>

  </section>
  <!-- /.sidebar -->
</aside>
