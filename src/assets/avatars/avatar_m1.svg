  <path d="M136 96 Q146 92 156 96" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <!-- eyes -->
  <ellipse cx="110" cy="104" rx="5" ry="3.5" fill="#1a2029"/>
  <ellipse cx="146" cy="104" rx="5" ry="3.5" fill="#1a2029"/>
  <!-- nose -->
  <path d="M128 110 Q124 120 128 124 Q132 120 128 110" fill="#e6bfae"/>
  <!-- mouth -->
  <path d="M118 136 Q128 140 138 136" stroke="#9e5a4a" stroke-width="2" fill="none"/>
  <!-- beard stubble -->
  <path d="M108 142 Q128 152 148 142" stroke="#b8907a" stroke-width="1" fill="none" opacity="0.6"/>
  <!-- neck -->
  <rect x="114" y="160" width="28" height="18" rx="6" fill="#f2d6c9"/>
  <!-- suit -->
  <path d="M60 256 C60 190 92 170 128 170 C164 170 196 190 196 256 Z" fill="url(#suit)"/>
  <!-- tie -->
